# Configuration for Cog ⚙️
# Reference: https://github.com/replicate/cog/blob/main/docs/yaml.md

build:
  # TokenRig needs an NVIDIA GPU with >= 14 GB of memory for inference.
  gpu: true

  # bpy only ships CPython 3.11 wheels for the 4.x LTS line, and the README
  # targets Python >= 3.11, so the image is pinned to 3.11.
  python_version: "3.11"

  # Matches the torch 2.7.0+cu128 wheels pinned in cog-requirements.txt.
  cuda: "12.8"

  system_packages:
    - "git"
    - "curl"
    # Shared libraries bpy (Blender as a Python module) and open3d dlopen,
    # even when running headless.
    - "libgl1"
    - "libegl1"
    - "libgomp1"
    - "libsm6"
    - "libxext6"
    - "libxrender1"
    - "libxi6"
    - "libxxf86vm1"
    - "libxfixes3"
    - "libxkbcommon0"
    - "libxrandr2"
    - "libxinerama1"
    - "libxcursor1"
    - "libdbus-1-3"

  python_requirements: cog-requirements.txt

  run:
    # flash-attn is imported at module scope by src/model/tokenrig.py and is the
    # attention implementation the Qwen3 backbone is instantiated with, so it is
    # a hard runtime requirement.
    #
    # Prebuilt wheel matching torch 2.7 / CUDA 12 / CPython 3.11. torch 2.7 pip
    # wheels use the C++11 ABI, hence cxx11abiTRUE. Compiling from source instead
    # takes hours and would blow the CI time limit.
    #
    # Cog (v0.22) installs Python with uv, so there is no `pip` binary and only
    # `python3` is on PATH; uv marks that Python as externally managed.
    - uv pip install --break-system-packages "https://github.com/Dao-AILab/flash-attention/releases/download/v2.8.3/flash_attn-2.8.3+cu12torch2.7cxx11abiTRUE-cp311-cp311-linux_x86_64.whl"

    # Bake the weights into the image so a cold boot never waits on the Hub.
    # Source code is not available to `run` commands, so these mirror the
    # download targets in download.py rather than calling it.
    - >
      python3 -c "from huggingface_hub import hf_hub_download;
      [hf_hub_download(repo_id='VAST-AI/SkinTokens', filename=f, local_dir='/src') for f in
      ['experiments/skin_vae_2_10_32768/last.ckpt',
      'experiments/articulation_xl_quantization_256_token_4/grpo_1400.ckpt']]"
    - >
      python3 -c "from huggingface_hub import snapshot_download;
      snapshot_download(repo_id='Qwen/Qwen3-0.6B', local_dir='/src/models/Qwen3-0.6B',
      ignore_patterns=['*.bin', '*.safetensors'])"

predict: "predict.py:Predictor"
