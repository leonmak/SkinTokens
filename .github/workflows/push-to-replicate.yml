# Builds the Cog image on an x86 Linux runner and pushes it to Replicate.
#
# One-time setup (repo Settings → Secrets and variables → Actions):
#   - Secret   REPLICATE_API_TOKEN  https://replicate.com/account/api-tokens
#   - Variable REPLICATE_MODEL      e.g. leonmak/skintokens (create the model on
#                                   replicate.com first)
name: Push to Replicate

on:
  workflow_dispatch:
    inputs:
      model_name:
        description: "Replicate model (owner/name). Defaults to the REPLICATE_MODEL variable."
        required: false

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      # The CUDA base image, torch and baked-in weights exceed the ~14 GB of free
      # disk a standard runner starts with.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          docker-images: false

      - uses: actions/checkout@v4

      - name: Set up Cog
        uses: replicate/setup-cog@v2
        with:
          token: ${{ secrets.REPLICATE_API_TOKEN }}
          # The action's default (v0.9.8) predates CUDA 12.8 support.
          cog-version: v0.22.0

      - name: Push to Replicate
        env:
          MODEL: ${{ inputs.model_name || vars.REPLICATE_MODEL }}
        run: |
          test -n "$MODEL" || { echo "Set the REPLICATE_MODEL variable or pass model_name"; exit 1; }
          # r8.im intermittently fails uploads with "unknown blob"
          # (https://github.com/replicate/cog/issues/3164). The image is already
          # built and tagged by then, so retry with a plain docker push.
          cog push "r8.im/$MODEL" && exit 0
          for attempt in 1 2 3; do
            echo "Retrying push ($attempt/3)"
            docker push "r8.im/$MODEL" && exit 0
            sleep 30
          done
          exit 1
